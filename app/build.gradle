plugins {
    id 'com.android.application'
}

// The JUCE plugin targets (in dusk-audio-plugins CMake project) that we package into this app.
// Each of them must have its entry in res/xml/aap_metadata.xml (library="lib{target}_Standalone.so").
def duskPluginTargets = [
    "FourKEQ",
    "MultiComp",
    "TapeMachine",
    "MultiQ",
    "SpectrumAnalyzer",
    "ChordAnalyzer",
    "DuskVerb",
    "TapeEcho",
]

android {
    namespace = "org.androidaudioplugin.ports.juce.dusk_audio_plugins"
    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        ndk {
            // should we make it customizable? We skip others just to reduce build time.
            abiFilters "x86_64", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID=1",
                    // Build native code optimized even for the debug variant (it overrides the Debug build
                    // type that AGP passes); DSP code in Debug builds (-O0) is too slow to be usable.
                    "-DCMAKE_BUILD_TYPE=Release",
                    "-DAAP_DIR=${System.env.AAP_DIR != null ? System.env.AAP_DIR : "$projectDir/../external/aap-core"}",
                    "-DAAP_JUCE_DIR=${System.env.AAP_JUCE_DIR != null ? System.env.AAP_JUCE_DIR : "$projectDir/../external/aap-juce"}",
                    "-DANDROID_STL=c++_shared", "-DANDROID_CPP_FEATURES=exceptions rtti",
                    // dusk-audio-plugins specific options
                    "-DJUCE_PATH=$projectDir/../external/JUCE",
                    "-DBUILD_CLAP=OFF",
                    "-DDUSK_COPY_AFTER_BUILD=OFF",
                    // not ported (yet)
                    "-DBUILD_CONVOLUTION_REVERB=OFF",
                    "-DBUILD_DUSKAMP=OFF",
                    "-DBUILD_GROOVEMIND=OFF"
                targets(*duskPluginTargets.collect { it + "_Standalone" })
            }
        }
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }

    sourceSets {
        // We do not compile JUCE Java sources: JUCE loads its classes that have native methods
        // (e.g. ComponentPeerView) from the byte-code embedded in each plugin library, so that
        // all the plugin libraries can live in the same process (see aap-juce docs/JUCE_GUI_SUPPORT.md).
        main.java.srcDirs +=
            ["${System.env.AAP_JUCE_DIR != null ? System.env.AAP_JUCE_DIR : "$projectDir/../external/aap-juce"}/java"]
        main.res.srcDirs +=
            []
    }

    dependencies {
        implementation libs.androidx.core.ktx
        implementation libs.startup.runtime
        implementation libs.aap.core
        implementation libs.aap.ui.web
        implementation libs.aap.ui.compose
        implementation libs.aap.ui.compose.app
        implementation libs.aap.js.controller
        // switch to them when you want to debug into aap-core.
        /*
        implementation project(":androidaudioplugin")
        implementation project(":androidaudioplugin-ui-web")
        implementation project(":androidaudioplugin-ui-compose")
        implementation project(":androidaudioplugin-ui-compose-app")
         */
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version libs.versions.cmake.get()
        }
    }

    buildFeatures {
        prefab true
    }

    ndkVersion libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
